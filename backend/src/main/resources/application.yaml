spring:
  application:
    name: pulsiris
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pulsiris}
    username: ${DB_USER:pulsiris}
    password: ${DB_PASSWORD:pulsiris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    runtime:
      flyway-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith
  endpoint:
    health:
      show-components: always
