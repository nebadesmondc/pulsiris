name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  # Gives the image CI built and tested for this commit its version tag; nothing is rebuilt.
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/nebadesmondc/pulsiris-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          tested="$IMAGE:sha-${commit::7}"
          if ! docker buildx imagetools inspect "$tested" > /dev/null 2>&1; then
            echo "::error::$tested does not exist. Tag a commit that CI has published from master."
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$version already exists. A released version is never moved."
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$version" "$tested"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --notes "Image: \`$IMAGE:${GITHUB_REF_NAME#v}\`"
